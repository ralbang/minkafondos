name: Actualizar convocatorias
on:
  schedule: [{cron: "0 11 * * *"}]   # todos los días, 6:00 a. m. hora de Colombia
  workflow_dispatch:
permissions: {contents: write}
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install anthropic requests
      - run: python actualizar.py
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - run: |
          git config user.name "radar-bot" && git config user.email "bot@users.noreply.github.com"
          git add convocatorias.json && git commit -m "Actualización diaria" || exit 0
          git push
