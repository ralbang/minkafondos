<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar de convocatorias</title>
<style>
:root{--bg:#f7f6f2;--fg:#1d1d1b;--mu:#6b6a63;--cd:#fff;--bd:#dedbd0;--ac:#1d6b4f;--wa:#b45309;--er:#b91c1c;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#151613;--fg:#ecebe4;--mu:#a09f96;--cd:#1e201c;--bd:#33352f;--ac:#4cc38a;--wa:#f59e0b;--er:#f87171;--ok:#4ade80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--bd)}h1{margin:0;font-size:20px}header small{color:var(--mu)}
nav{display:flex;gap:6px;padding:10px 20px;flex-wrap:wrap}nav button{background:none;border:1px solid var(--bd);color:var(--fg);padding:7px 14px;border-radius:20px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:900px;margin:0 auto;padding:10px 20px 50px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:10px 0}
.c h3{margin:0 0 4px;font-size:15px}.mu{color:var(--mu);font-size:13px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--bd);margin:2px 3px 2px 0}
.er{color:var(--er);border-color:var(--er)}.wa{color:var(--wa);border-color:var(--wa)}.ok{color:var(--ok);border-color:var(--ok)}
input,select{background:var(--cd);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:7px;font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1;min-width:130px}
button.p{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
a.b{display:inline-block;margin-top:6px;color:var(--ac);font-weight:600}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:6px 0}.bar i{display:block;height:6px;border-radius:3px;background:var(--ac)}
</style></head><body>
<header><h1>Radar de convocatorias</h1><small id="meta"></small></header>
<nav id="nav"></nav><main id="v"></main>
<script>
const SEED={"actualizado":"2026-10-21","convocatorias":[
{"id":"minciencias-56","nombre":"Convocatoria de emergencia: recuperación y capacidades transformadoras (SGR-CTeI)","entidad":"Minciencias","cats":["agro","comun"],"orgs":["fundacion","asociacion","cooperativa"],"min":null,"max":null,"apertura":"2026-10-08","cierre":null,"estado":"abierta","meses":[],"url":"https://minciencias.gov.co/convocatorias/todas","req":["personeria","rut","estatutos","cuenta","contab","rl","exp","cap","aliado","cofin","mga"],"nota":"Bolsa de $700.000 millones. Se ejecuta con universidad/centro aliado. La fecha de cierre no se pudo verificar: confírmela en los términos de referencia.","verificado":"2026-10-21"},
{"id":"avery-2026","nombre":"Avery Dennison Foundation: educación, sostenibilidad y medios de vida","entidad":"Avery Dennison Foundation","cats":["comun"],"orgs":["fundacion","asociacion","cooperativa"],"min":null,"max":null,"apertura":null,"cierre":"2026-11-03","estado":"abierta","meses":[],"url":"https://www.diagramconsultores.com/convocatorias-subvenciones-y-financiaciones-publicas-y-privadas/","req":["personeria","rut","estatutos","cuenta","contab","rl","pla"],"nota":"Reportada por un agregador, no por la fundación. Verifique que Colombia sea país elegible antes de invertir tiempo.","verificado":"2026-10-21"},
{"id":"gfcf-permanente","nombre":"Global Fund for Community Foundations: subvenciones pequeñas (nota conceptual)","entidad":"GFCF","cats":["comun"],"orgs":["fundacion","asociacion"],"min":null,"max":null,"apertura":null,"cierre":null,"estado":"abierta","meses":[],"url":"https://noticiasconcausa.com/subvenciones-2026-para-ongs-financiamiento-internacional-del-gfcf/","req":["personeria","rut","estatutos","cuenta","contab","rl"],"nota":"Postulación todo el año. Enlace a nota informativa; busque la página oficial del fondo desde allí.","verificado":"2026-10-21"},
{"id":"adr-pidar","nombre":"ADR: Proyectos Integrales de Desarrollo Agropecuario y Rural (PIDAR)","entidad":"Agencia de Desarrollo Rural","cats":["agro","infra"],"orgs":["JAC","asociacion","cooperativa","resguardo"],"min":null,"max":null,"apertura":null,"cierre":null,"estado":"recurrente","meses":[],"url":"https://www.adr.gov.co/atencion-y-servicios-a-la-ciudadania/proyectos-integrales-2/","req":["personeria","rut","estatutos","cuenta","contab","rl","exp","cap","mga","cofin"],"nota":"Las convocatorias asociativas se abren según disponibilidad presupuestal. En 2023 cofinanció entre $1.200 y $5.000 millones. Hoy no hay convocatoria abierta confirmada.","verificado":"2026-10-21"},
{"id":"sgr-ocad-paz","nombre":"Sistema General de Regalías: OCAD Paz e Inversión Regional","entidad":"DNP / ART / entidades territoriales","cats":["infra","agro"],"orgs":["JAC","asociacion","fundacion","cooperativa","resguardo","consejo"],"min":500000000,"max":null,"apertura":null,"cierre":null,"estado":"recurrente","meses":[10,11,12],"url":"https://www.dnp.gov.co/Prensa_/Noticias/Paginas/postulacion-historica-proyectos-1a-convocatoria-ocad-paz-2025-2026.aspx","req":["personeria","mga","cofin","cap"],"nota":"Acceso indirecto: postula la alcaldía o gobernación y la ESAL se asocia como coejecutora.","verificado":null},
{"id":"ps-economia-popular","nombre":"Prosperidad Social: Economía Popular para el Cambio y fortalecimiento territorial","entidad":"Prosperidad Social","cats":["comun","infra"],"orgs":["JAC","asociacion","fundacion","cooperativa"],"min":null,"max":null,"apertura":null,"cierre":null,"estado":"recurrente","meses":[4,5,6],"url":"https://prosperidadsocial.gov.co/programas/economia-popular-para-el-cambio/","req":["personeria","rut","estatutos","cuenta","contab","rl","rup"],"nota":"Revise también SECOP cuando la convocatoria se tramite como contratación.","verificado":null},
{"id":"minagricultura-cadenas","nombre":"MinAgricultura: convocatorias de cadenas pecuarias, pesqueras y acuícolas","entidad":"MinAgricultura","cats":["agro"],"orgs":["asociacion","cooperativa","JAC"],"min":null,"max":null,"apertura":null,"cierre":null,"estado":"recurrente","meses":[4,5,6],"url":"https://www.minagricultura.gov.co/el-ministerio/direcciones/cadenas-pecuarias-pesqueras-y-acuicolas/convocatorias","req":["personeria","rut","estatutos","cuenta","contab","rl","exp","cap","cofin"],"nota":"Algunas convocatorias piden 5 años de experiencia en la cadena.","verificado":null},
{"id":"minvivienda-comuniagua","nombre":"MinVivienda: Ruta ComuniAgua (acueductos comunitarios)","entidad":"MinVivienda","cats":["infra"],"orgs":["JAC","cooperativa","asociacion"],"min":null,"max":null,"apertura":null,"cierre":null,"estado":"recurrente","meses":[],"url":"https://www.minvivienda.gov.co/ruta-comuniagua","req":["personeria","rut","estatutos","cuenta","contab","rl","mga","cofin"],"nota":"Requiere registro como organización comunitaria de agua y cofinanciación de la alcaldía.","verificado":null},
{"id":"minambiente-compensacion","nombre":"MinAmbiente: Fondo de Compensación Ambiental y convocatoria ambiental","entidad":"MinAmbiente","cats":["agro","comun"],"orgs":["fundacion","asociacion","cooperativa","resguardo","consejo"],"min":null,"max":null,"apertura":null,"cierre":null,"estado":"recurrente","meses":[1,2,3],"url":"https://www.minambiente.gov.co/abierta-convocatoria-del-fondo-de-compensacion-ambiental-por-112-883-millones/","req":["personeria","rut","estatutos","cuenta","contab","rl","mga","cap"],"nota":"Acceso mayormente vía CAR o entidad territorial.","verificado":null},
{"id":"ppd-colombia","nombre":"Programa de Pequeñas Donaciones GEF–PNUD Colombia","entidad":"PNUD / GEF","cats":["agro","comun"],"orgs":["JAC","asociacion","fundacion","cooperativa","resguardo","consejo"],"min":null,"max":null,"apertura":null,"cierre":null,"estado":"recurrente","meses":[7,8,9],"url":"https://ppdcolombia.org/","req":["personeria","rut","estatutos","cuenta","rl","pla"],"nota":"Topes de referencia: USD 15.000 a 35.000. No se confirmó convocatoria vigente en Colombia.","verificado":null},
{"id":"ue-eeas","nombre":"Unión Europea: llamadas a propuestas para sociedad civil","entidad":"Delegación UE","cats":["comun","infra","agro"],"orgs":["fundacion"],"min":null,"max":null,"apertura":null,"cierre":null,"estado":"recurrente","meses":[],"url":"https://www.eeas.europa.eu/eeas/grants_en","req":["personeria","rut","estatutos","cuenta","contab","rl","exp","cap","ctrl","pla","cofin"],"nota":"Una JAC sola difícilmente califica; lo habitual es entrar en consorcio con una ONG con experiencia UE.","verificado":null},
{"id":"fontagro-2026","nombre":"FONTAGRO: convocatoria 2026 de innovación agropecuaria","entidad":"FONTAGRO","cats":["agro"],"orgs":["asociacion","fundacion","cooperativa"],"min":null,"max":null,"apertura":null,"cierre":null,"estado":"recurrente","meses":[],"url":"https://fontagro.org/es/iniciativas/convocatorias/convocatoria-2026","req":["personeria","rut","estatutos","cuenta","contab","rl","exp","cap","aliado","cofin"],"nota":"Exige consorcio con centros de investigación. Confirme si la ventana 2026 sigue abierta.","verificado":null}
]};
const ORGS={JAC:"Junta de Acción Comunal",asociacion:"Asociación / organización de productores",fundacion:"Fundación, corporación u ONG",cooperativa:"Cooperativa / economía solidaria",resguardo:"Resguardo indígena",consejo:"Consejo comunitario"};
const CATS={infra:"Infraestructura social",agro:"Agropecuario",comun:"Comunitario / social"};
const REQ={personeria:"Personería jurídica vigente",rut:"RUT y CIIU actualizados",estatutos:"Estatutos con objeto social acorde",rte:"Permanencia en Régimen Tributario Especial",cuenta:"Cuenta bancaria a nombre de la entidad",contab:"Contabilidad y estados financieros",rl:"Representante legal y órganos vigentes",exp:"Certificaciones de experiencia",cap:"Capacidad administrativa y financiera",ctrl:"Control interno y transparencia",pla:"Políticas de PLA y datos personales",rup:"RUP / inscripción en SECOP",aliado:"Aliado (universidad u organización ancla)",cofin:"Contrapartida o aporte en especie",mga:"Proyecto formulado en MGA / marco lógico"};
const MIN=10e6,K="radar-v1";
let S={org:{tipo:"JAC",req:{}},proy:[],cat:SEED.convocatorias,act:SEED.actualizado,tab:"alertas",f:{q:"",e:"",c:""}};
try{const s=JSON.parse(localStorage.getItem(K));if(s){S.org=s.org||S.org;S.proy=s.proy||[];if(s.cat&&s.cat.length&&(s.act||"")>(SEED.actualizado||"")){S.cat=s.cat;S.act=s.act}}}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify({org:S.org,proy:S.proy,cat:S.cat,act:S.act}))}catch(e){}};
fetch("convocatorias.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.convocatorias){S.cat=j.convocatorias;S.act=j.actualizado;save();draw()}}).catch(()=>{});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cop=n=>"$"+Number(n).toLocaleString("es-CO");
const dias=d=>Math.ceil((new Date(d+"T23:59:59")-Date.now())/864e5);
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function match(p,c){const cat=c.cats.includes(p.cat),org=c.orgs.includes(S.org.tipo),
 amt=(c.min==null||p.monto>=c.min)&&(c.max==null||p.monto<=c.max);
 const falta=c.req.filter(k=>S.org.req[k]!=="ok"),pts=c.req.reduce((a,k)=>a+(S.org.req[k]==="ok"?1:S.org.req[k]==="parcial"?.5:0),0),
 ready=c.req.length?pts/c.req.length:1;
 return{cat,org,amt,falta,ready,score:(cat?40:0)+(org?30:0)+(amt?20:0)+Math.round(ready*10)}}
function alertas(){const out=[],hoy=new Date(),m=hoy.getMonth()+1;
 S.cat.forEach(c=>{const ms=S.proy.filter(p=>match(p,c).cat&&match(p,c).org).map(p=>p.nombre);
  if(c.cierre){const d=dias(c.cierre);if(d>=0&&d<=30)out.push({t:"cierre",d,c,ms,txt:d===0?"Cierra hoy":"Cierra en "+d+" días ("+c.cierre+")"})}
  else if(c.estado==="recurrente"&&c.meses&&c.meses.length){
   if(c.meses.includes(m))out.push({t:"apertura",d:0,c,ms,txt:"Estamos en su ventana habitual de apertura"});
   else{const n=c.meses.map(x=>{const f=new Date(hoy.getFullYear()+(x<m?1:0),x-1,1);return Math.ceil((f-hoy)/864e5)}).sort((a,b)=>a-b)[0];
    if(n<=90)out.push({t:"apertura",d:n,c,ms,txt:"Apertura probable en ~"+n+" días ("+c.meses.map(x=>MES[x-1]).join(", ")+")"})}}});
 return out.sort((a,b)=>a.d-b.d)}
function ics(){const al=alertas().filter(a=>a.c.cierre),L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Radar//ES"];
 al.forEach(a=>{const d=a.c.cierre.replace(/-/g,"");L.push("BEGIN:VEVENT","UID:"+a.c.id+"@radar","DTSTAMP:"+d+"T000000Z","DTSTART;VALUE=DATE:"+d,"SUMMARY:Cierre: "+a.c.nombre.replace(/[,;]/g," "),"URL:"+a.c.url,"BEGIN:VALARM","TRIGGER:-P7D","ACTION:DISPLAY","DESCRIPTION:Faltan 7 días","END:VALARM","END:VEVENT")});
 L.push("END:VCALENDAR");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.join("\r\n")],{type:"text/calendar"}));a.download="cierres.ics";a.click()}
function conv(c,extra=""){const est=c.estado==="abierta"?'<span class="chip ok">Abierta</span>':c.estado==="recurrente"?'<span class="chip wa">Recurrente / por abrir</span>':'<span class="chip er">Cerrada</span>';
 return'<div class="c"><h3>'+esc(c.nombre)+'</h3><div class="mu">'+esc(c.entidad)+" · "+(c.cierre?"cierre "+esc(c.cierre):c.estado==="abierta"?"sin fecha de cierre verificada":"sin convocatoria abierta confirmada")+" · "+(c.verificado?"verificada "+esc(c.verificado):"sin verificar hoy")+"</div>"+est+c.cats.map(x=>'<span class="chip">'+CATS[x]+"</span>").join("")+extra+'<div class="mu">'+esc(c.nota||"")+'</div><a class="b" href="'+esc(c.url)+'" target="_blank" rel="noopener">Abrir convocatoria ↗</a></div>'}
const V={
alertas(){const al=alertas();return'<div class="row"><button class="p" onclick="ics()">Descargar recordatorios (.ics)</button><button class="p" onclick="notif()">Activar avisos del navegador</button></div>'+
 (al.length?al.map(a=>conv(a.c,'<div><span class="chip '+(a.t==="cierre"&&a.d<=7?"er":"wa")+'">'+esc(a.txt)+"</span>"+(a.ms.length?'<span class="chip ok">Aplica a: '+a.ms.map(esc).join(", ")+"</span>":"")+"</div>")).join(""):'<p class="mu">No hay cierres en 30 días ni aperturas probables en 90 días.</p>')},
conv(){const f=S.f,l=S.cat.filter(c=>(!f.e||c.estado===f.e)&&(!f.c||c.cats.includes(f.c))&&(c.nombre+c.entidad).toLowerCase().includes(f.q.toLowerCase()));
 return'<div class="row"><input id="q" placeholder="Buscar por nombre o entidad" value="'+esc(f.q)+'" oninput="S.f.q=this.value;draw(1)"><select onchange="S.f.e=this.value;draw()"><option value="">Todos los estados</option><option value="abierta"'+(f.e==="abierta"?" selected":"")+'>Abiertas</option><option value="recurrente"'+(f.e==="recurrente"?" selected":"")+'>Recurrentes</option></select><select onchange="S.f.c=this.value;draw()"><option value="">Todos los tipos</option>'+Object.entries(CATS).map(([k,v])=>'<option value="'+k+'"'+(f.c===k?" selected":"")+">"+v+"</option>").join("")+"</select></div>"+
 '<p class="mu">'+l.length+' resultados. <label class="p" style="cursor:pointer;color:var(--ac)">Importar catálogo (.json)<input type="file" accept=".json" hidden onchange="imp(this)"></label></p>'+l.map(c=>conv(c)).join("")},
proy(){return'<div class="c"><div class="row"><input id="pn" placeholder="Nombre del proyecto"><select id="pc">'+Object.entries(CATS).map(([k,v])=>'<option value="'+k+'">'+v+"</option>").join("")+'</select><input id="pm" type="number" placeholder="Monto en COP (mínimo 10 millones)"></div><button class="p" onclick="addP()">Agregar proyecto</button></div>'+
 S.proy.map((p,i)=>{const r=S.cat.map(c=>({c,m:match(p,c)})).filter(x=>x.m.cat&&x.m.org).sort((a,b)=>b.m.score-a.m.score).slice(0,6);
 return'<div class="c"><h3>'+esc(p.nombre)+'</h3><div class="mu">'+CATS[p.cat]+" · "+cop(p.monto)+' · <a href="#" onclick="S.proy.splice('+i+',1);save();draw();return false">quitar</a></div>'+
 (r.length?r.map(x=>'<div class="c"><b>'+esc(x.c.nombre)+'</b> <span class="chip ok">Afinidad '+x.m.score+"/100</span>"+(x.m.amt?"":'<span class="chip wa">Monto fuera de rango</span>')+'<div class="bar"><i style="width:'+Math.round(x.m.ready*100)+'%"></i></div><div class="mu">Cumple '+Math.round(x.m.ready*100)+"% de requisitos. "+(x.m.falta.length?"Faltan:":"Sin brechas.")+"</div>"+x.m.falta.map(k=>'<span class="chip '+(S.org.req[k]==="parcial"?"wa":"er")+'">'+REQ[k]+"</span>").join("")+'<br><a class="b" href="'+esc(x.c.url)+'" target="_blank" rel="noopener">Abrir convocatoria ↗</a></div>').join(""):'<p class="mu">Ninguna convocatoria del catálogo acepta su figura jurídica para este tipo de proyecto.</p>')+"</div>"}).join("")},
org(){return'<div class="c"><b>Figura jurídica</b><div class="row"><select onchange="S.org.tipo=this.value;save()">'+Object.entries(ORGS).map(([k,v])=>'<option value="'+k+'"'+(S.org.tipo===k?" selected":"")+">"+v+"</option>").join("")+"</select></div></div>"+
 '<div class="c"><b>Diagnóstico de requisitos</b>'+Object.entries(REQ).map(([k,v])=>'<div class="row"><span style="flex:2">'+v+'</span><select onchange="S.org.req[\''+k+'\']=this.value;save()">'+[["no","No cumple"],["parcial","Parcial"],["ok","Cumple"]].map(([a,b])=>'<option value="'+a+'"'+((S.org.req[k]||"no")===a?" selected":"")+">"+b+"</option>").join("")+"</select></div>").join("")+"</div>"}};
function addP(){const n=pn.value.trim(),m=+pm.value;if(!n)return;if(m<MIN){alert("El monto debe ser de al menos $10.000.000.");return}S.proy.push({nombre:n,cat:pc.value,monto:m});save();draw()}
function imp(el){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);S.cat=j.convocatorias;S.act=j.actualizado;save();draw()}catch(e){alert("Archivo no válido")}};r.readAsText(el.files[0])}
function notif(){if(!("Notification"in window))return alert("Este navegador no admite avisos.");Notification.requestPermission().then(p=>{if(p==="granted")pushN()})}
function pushN(){alertas().slice(0,3).forEach(a=>new Notification(a.txt,{body:a.c.nombre}))}
function draw(keep){nav.innerHTML=[["alertas","Alertas"],["conv","Convocatorias"],["proy","Proyectos y cruce"],["org","Mi organización"]].map(([k,v])=>'<button class="'+(S.tab===k?"on":"")+'" onclick="S.tab=\''+k+'\';draw()">'+v+"</button>").join("");
 meta.textContent="Catálogo actualizado: "+(S.act||"—")+" · "+S.cat.length+" fuentes";v.innerHTML=V[S.tab]();if(keep){const q=document.getElementById("q");if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}}
draw();if("Notification"in window&&Notification.permission==="granted")pushN();
</script></body></html>
