<style>
:root{--bg:#f7f6f2;--fg:#1d1d1b;--mu:#6b6a63;--cd:#fff;--bd:#dedbd0;--ac:#1d6b4f;--wa:#b45309;--er:#b91c1c;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#151613;--fg:#ecebe4;--mu:#a09f96;--cd:#1e201c;--bd:#33352f;--ac:#4cc38a;--wa:#f59e0b;--er:#f87171;--ok:#4ade80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px}header img{width:48px;height:48px;border-radius:50%}h1{margin:0;font-size:20px}header small{color:var(--mu)}
nav{display:flex;gap:6px;padding:10px 20px;flex-wrap:wrap}nav button{background:none;border:1px solid var(--bd);color:var(--fg);padding:7px 14px;border-radius:20px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sb{max-width:900px;margin:4px auto 0;padding:0 20px}.sb input{width:100%;font-size:16px;padding:10px 12px}
main{max-width:900px;margin:0 auto;padding:10px 20px 50px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:10px 0}
.c h3{margin:0 0 4px;font-size:15px}.mu{color:var(--mu);font-size:13px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--bd);margin:2px 3px 2px 0}
.er{color:var(--er);border-color:var(--er)}.wa{color:var(--wa);border-color:var(--wa)}.ok{color:var(--ok);border-color:var(--ok)}
input,select{background:var(--cd);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:7px;font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1;min-width:130px}
button.p{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
a.b{display:inline-block;margin-top:6px;color:var(--ac);font-weight:600}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:6px 0}.bar i{display:block;height:6px;border-radius:3px;background:var(--ac)}

function match(p,c){const cat=c.cats.includes(p.cat),org=c.orgs.includes(S.org.tipo),
 amt=(c.min==null||p.monto>=c.min)&&(c.max==null||p.monto<=c.max);
 const falta=c.req.filter(k=>S.org.req[k]!=="ok"),pts=c.req.reduce((a,k)=>a+(S.org.req[k]==="ok"?1:S.org.req[k]==="parcial"?.5:0),0),
 ready=c.req.length?pts/c.req.length:1;
 return{cat,org,amt,falta,ready,score:(cat?40:0)+(org?30:0)+(amt?20:0)+Math.round(ready*10)}}
function alertas(){const out=[],hoy=new Date(),m=hoy.getMonth()+1;
 S.cat.forEach(c=>{const ms=S.proy.filter(p=>match(p,c).cat&&match(p,c).org).map(p=>p.nombre);
  if(c.cierre){const d=dias(c.cierre);if(d>=0&&d<=30)out.push({t:"cierre",d,c,ms,txt:d===0?"Cierra hoy":"Cierra en "+d+" días ("+c.cierre+")"})}
  else if(c.estado==="recurrente"&&c.meses&&c.meses.length){
   if(c.meses.includes(m))out.push({t:"apertura",d:0,c,ms,txt:"Estamos en su ventana habitual de apertura"});
   else{const n=c.meses.map(x=>{const f=new Date(hoy.getFullYear()+(x<m?1:0),x-1,1);return Math.ceil((f-hoy)/864e5)}).sort((a,b)=>a-b)[0];
    if(n<=90)out.push({t:"apertura",d:n,c,ms,txt:"Apertura probable en ~"+n+" días ("+c.meses.map(x=>MES[x-1]).join(", ")+")"})}}});
 return out.sort((a,b)=>a.d-b.d)}

 L.push("END:VCALENDAR");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.join("\r\n")],{type:"text/calendar"}));a.download="cierres.ics";a.click()}

 '<p class="mu">'+l.length+' resultados. <label class="p" style="cursor:pointer;color:var(--ac)">Importar catálogo (.json)<input type="file" accept=".json" hidden onchange="imp(this)"></label></p>'+l.map(c=>conv(c)).join("")},
proy(){return'<div class="c"><div class="row"><input id="pn" placeholder="Nombre del proyecto"><select id="pc">'+Object.entries(CATS).map(([k,v])=>'<option value="'+k+'">'+v+"</option>").join("")+'</select><input id="pm" type="number" placeholder="Monto en COP (mínimo 10 millones)"></div><button class="p" onclick="addP()">Agregar proyecto</button></div>'+
 S.proy.map((p,i)=>{const r=S.cat.map(c=>({c,m:match(p,c)})).filter(x=>x.m.cat&&x.m.org).sort((a,b)=>b.m.score-a.m.score).slice(0,6);

 (r.length?r.map(x=>'<div class="c"><b>'+esc(x.c.nombre)+'</b> <span class="chip ok">Afinidad '+x.m.score+"/100</span>"+(x.m.amt?"":'<span class="chip wa">Monto fuera de rango</span>')+'<div class="bar"><i style="width:'+Math.round(x.m.ready*100)+'%"></i></div><div class="mu">Cumple '+Math.round(x.m.ready*100)+"% de requisitos. "+(x.m.falta.length?"Faltan:":"Sin brechas.")+"</div>"+x.m.falta.map(k=>'<span class="chip '+(S.org.req[k]==="parcial"?"wa":"er")+'">'+REQ[k]+"</span>").join("")+'<br><a class="b" href="'+esc(x.c.url)+'" target="_blank" rel="noopener">Abrir convocatoria ↗</a></div>').join(""):'<p class="mu">Ninguna convocatoria del catálogo acepta su figura jurídica para este tipo de proyecto.</p>')+"</div>"}).join("")},
org(){return'<div class="c"><b>Figura jurídica</b><div class="row"><select onchange="S.org.tipo=this.value;save()">'+Object.entries(ORGS).map(([k,v])=>'<option value="'+k+'"'+(S.org.tipo===k?" selected":"")+">"+v+"</option>").join("")+"</select></div></div>"+
